name: Package & Release Add-on

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Package NVDA Add-on
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate tag version matches manifest version
        shell: bash
        run: |
          # Extract version from manifest.ini
          MANIFEST_VERSION=$(grep -E '^version\s*=' manifest.ini | sed 's/version\s*=\s*//' | tr -d '[:space:]')
          echo "Manifest version: ${MANIFEST_VERSION}"

          # Only validate when triggered by a tag push
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            echo "Tag version: ${TAG_VERSION}"
            if [[ "${MANIFEST_VERSION}" != "${TAG_VERSION}" ]]; then
              echo "ERROR: manifest.ini version (${MANIFEST_VERSION}) does not match tag version (${TAG_VERSION})"
              echo "Please update manifest.ini to version = ${TAG_VERSION} before tagging."
              exit 1
            fi
          fi

          echo "ADDON_VERSION=${MANIFEST_VERSION}" >> "${GITHUB_ENV}"

      - name: Remove any stale add-on packages from working tree
        shell: bash
        run: |
          # Prevent stale previously-committed .nvda-addon files from being uploaded
          find . -maxdepth 1 -name '*.nvda-addon' -delete
          echo "Cleaned stale .nvda-addon files from working tree."

      - name: Fetch Runtime Dependencies (gRPC wheels)
        run: |
          python build_addon.py --fetch-deps

      - name: Package .nvda-addon
        run: |
          python build_addon.py

      - name: Verify exactly one correctly-named package was built
        shell: bash
        run: |
          EXPECTED="wisprFlow-${ADDON_VERSION}.nvda-addon"
          if [[ ! -f "${EXPECTED}" ]]; then
            echo "ERROR: Expected package '${EXPECTED}' was not found after build."
            ls -la *.nvda-addon 2>/dev/null || echo "(no .nvda-addon files found)"
            exit 1
          fi
          COUNT=$(ls wisprFlow-*.nvda-addon 2>/dev/null | wc -l)
          if [[ "${COUNT}" -ne 1 ]]; then
            echo "ERROR: Expected exactly 1 .nvda-addon package, found ${COUNT}:"
            ls wisprFlow-*.nvda-addon
            exit 1
          fi
          SIZE=$(stat -c%s "${EXPECTED}" 2>/dev/null || stat -f%z "${EXPECTED}")
          echo "Package verified: ${EXPECTED} (${SIZE} bytes)"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: wisprFlow-${{ env.ADDON_VERSION }}.nvda-addon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
